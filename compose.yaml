name: university-management-system

services:
  db:
    image: mysql:8.0
    container_name: university_db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-university_db}
      MYSQL_USER: ${MYSQL_USER:-university_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-university_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: university_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-university_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-university_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-university_pass}

volumes:
  mysql_data:
