<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Directory - University Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Teacher Directory</h2>
        <div th:if="${isAdmin}">
            <a th:href="@{/teacher/teachers/new}" class="btn btn-primary">+ Add New Teacher</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th style="width: 200px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="teacher : ${teachers}">
                        <td th:text="${teacher.id}"></td>
                        <td>
                            <strong th:text="${teacher.fullName}"></strong>
                            <span th:if="${teacher.email == currentUserEmail}" class="badge bg-info text-dark ms-1">You</span>
                        </td>
                        <td th:text="${teacher.email}"></td>
                        <td th:text="${teacher.department}"></td>
                        <td th:text="${teacher.designation}"></td>
                        <td>
                            <!-- Can edit/delete if Admin OR if it's the teacher's own record -->
                            <div th:if="${isAdmin or teacher.email == currentUserEmail}">
                                <a th:href="@{/teacher/teachers/edit/{id}(id=${teacher.id})}" class="btn btn-sm btn-outline-secondary btn-action">Edit</a>
                                <form th:action="@{/teacher/teachers/delete/{id}(id=${teacher.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Are you sure you want to delete this teacher account?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </div>
                            <div th:if="${not isAdmin and teacher.email != currentUserEmail}">
                                <span class="badge bg-light text-muted border">View Only</span>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(teachers)}">
                        <td colspan="6" class="text-center text-muted py-4">No teacher records found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
