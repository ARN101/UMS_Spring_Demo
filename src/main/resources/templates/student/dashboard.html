<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - University Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="p-4 mb-4 bg-white rounded shadow-sm border">
        <h2>Welcome, <span th:text="${student != null ? student.fullName : 'Student'}"></span>!</h2>
        <p class="lead text-muted mb-0">Logged in as: <strong th:text="${userEmail}"></strong></p>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">My Profile</h5>
                    <p class="card-text text-muted">View or update your own personal information, semester, roll number, and password.</p>
                    <a th:if="${myStudentId != null}" th:href="@{/student/students/edit/{id}(id=${myStudentId})}" class="btn btn-outline-primary">Edit My Profile</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Student Directory</h5>
                    <p class="card-text text-muted">Browse directory of fellow students in the university.</p>
                    <a th:href="@{/student/students}" class="btn btn-primary">View Students</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
