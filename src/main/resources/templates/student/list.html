<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory - University Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Student Directory</h2>
        <div>
            <!-- Admin can add directly -->
            <a th:if="${isAdmin}" th:href="@{/student/students/new}" class="btn btn-primary">+ Add New Student</a>
            <!-- Teacher can add, but requires approval -->
            <a th:if="${isTeacher}" th:href="@{/student/students/new}" class="btn btn-success">+ Add Student (Requires Approval)</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Semester</th>
                        <th>Roll Number</th>
                        <th th:if="${isAdmin}">Status</th>
                        <th style="width: 200px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="student : ${students}">
                        <td th:text="${student.id}"></td>
                        <td>
                            <strong th:text="${student.fullName}"></strong>
                            <span th:if="${student.email == currentUserEmail}" class="badge bg-info text-dark ms-1">You</span>
                        </td>
                        <td th:text="${student.email}"></td>
                        <td th:text="${student.department}"></td>
                        <td th:text="${student.semester}"></td>
                        <td th:text="${student.rollNumber}"></td>
                        <td th:if="${isAdmin}">
                            <span th:if="${student.approved}" class="badge bg-success">Approved</span>
                            <span th:if="${not student.approved}" class="badge bg-warning text-dark">Pending</span>
                        </td>
                        <td>
                            <!-- Admin can edit/delete all; Student can edit/delete only own profile -->
                            <div th:if="${isAdmin or (isStudent and student.email == currentUserEmail)}">
                                <a th:href="@{/student/students/edit/{id}(id=${student.id})}" class="btn btn-sm btn-outline-secondary btn-action">Edit</a>
                                <form th:action="@{/student/students/delete/{id}(id=${student.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Are you sure you want to delete this student account?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </div>
                            <!-- Teachers or other students see View Only -->
                            <div th:if="${not isAdmin and (isTeacher or (isStudent and student.email != currentUserEmail))}">
                                <span class="badge bg-light text-muted border">View Only</span>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td th:colspan="${isAdmin ? 8 : 7}" class="text-center text-muted py-4">No student records found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
